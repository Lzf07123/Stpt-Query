name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      # 评审栈卷名覆盖必须始终可与主 compose 叠加
      - name: Validate Compose (review overlay)
        run: docker compose -f docker-compose.yml -f compose.review.yml config --quiet

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -q -t edu-query-app:test .
      - name: Run pytest
        run: |
          docker run --rm -v "$PWD":/app -w /app edu-query-app:test \
            sh -c "pip install -q pytest pytest-asyncio && python -m pytest -q"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build CSS
        working-directory: frontend
        run: npm run build
      - name: Verify CSP
        run: docker build -q -t edu-query-app:test . && docker run --rm -v "$PWD":/app -w /app edu-query-app:test sh -c "pip install -q pytest && python -m pytest -q tests/test_frontend_csp.py tests/test_security.py::test_inline_script_hashes_are_covered_by_csp"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          # picomatch GHSA-fc5q-39xc-vjpf（<=4.0.7）修复版尚未发布，无法通过升级消除：
          # 仅存在于构建期 devDependency 链（@tailwindcss/cli → @parcel/watcher →
          # micromatch → picomatch），运行时零第三方资源不受影响。npm audit 会把链上
          # 每个包都列为漏洞条目（全新 npm ci 的键集合见豁免集合），允许集合之外的
          # 漏洞一律使审计失败；picomatch 发布修复版后请把该豁免移除。
          npm audit --json > audit.json || true
          python3 - <<'PY'
          import json, sys

          allow = {"picomatch", "micromatch", "@parcel/watcher", "@tailwindcss/cli"}
          vulns = json.load(open("audit.json")).get("vulnerabilities", {})
          unexpected = sorted(set(vulns) - allow)
          if unexpected:
              print("未豁免的漏洞:", unexpected)
              sys.exit(1)
          print("npm audit: 仅剩已豁免的构建链漏洞", sorted(vulns) or "无")
          PY
          rm -f audit.json

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build single-container image
        run: APP_IMAGE_TAG=${{ github.sha }} docker compose build
