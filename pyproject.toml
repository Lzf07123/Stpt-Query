[project]
name = "edu-query-app"
version = "0.1.0"
description = "教务查询编排服务：替代 Dify 工作流，直接编排登录/查询/渲染/分析/PDF"
requires-python = ">=3.9"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 显式固定异步 fixture 的 loop scope，消除 pytest-asyncio 的
# PytestDeprecationWarning（未来版本默认值将从 fixture scope 改为 function）
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
