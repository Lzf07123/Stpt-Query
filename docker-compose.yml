services:
  # ===== 容器 1：查询代理（复用 get-infomation-service）=====
  # 仅挂在 internal 内网，只有格式化后端可调用，不映射任何宿主端口
  get-infomation-service:
    build:
      context: ../STPT-Query/get-infomation-service
      args:
        BASE_IMAGE: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}python:3.11-slim
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}jwxt-service:latest
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8766"
    env_file:
      - path: ../STPT-Query/get-infomation-service/.env
        required: false
    environment:
      - JWXT_API_TOKEN=${SERVICE_API_TOKEN:-}
      # 对外链接（免密登录/课表下载）基准地址：公网入口，浏览器可达
      - JWXT_PUBLIC_URL=${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      # 小项目单实例：不启用 Redis 共享状态
      - JWXT_REDIS_URL=
      - JWXT_TRUST_PROXY=0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ===== 容器 2：格式化后端（编排 + 渲染 + 分析 + PDF）=====
  # 同时挂 web 与 internal：对外只经 nginx 反代，向内调查询代理
  format-service:
    build: ./format-service
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}edu-query-format:latest
    restart: unless-stopped
    networks:
      - web
      - internal
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AUTO_ROTATE_TOKEN=${AUTO_ROTATE_TOKEN:-false}
      - API_TOKEN=${API_TOKEN:-change-me}
      - SERVICE_BASE_URL=${SERVICE_BASE_URL:-http://get-infomation-service:8766}
      - SERVICE_API_TOKEN=${SERVICE_API_TOKEN:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1024}
      - RATE_LIMIT=${RATE_LIMIT:-30}
    depends_on:
      get-infomation-service:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ===== 容器 3：前端（唯一对外入口）=====
  # nginx 静态页 + 反代 /run、/service-status、/health* 到格式化后端
  frontend:
    build: ./frontend
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}edu-query-frontend:latest
    restart: unless-stopped
    networks:
      - web
    environment:
      # 与 format-service 共用同一 API_TOKEN，由 nginx 反代时注入 Authorization
      - API_TOKEN=${API_TOKEN:-change-me}
    ports:
      - "8000:80"
    depends_on:
      format-service:
        condition: service_started

networks:
  # 对外边缘网络：nginx ↔ 格式化后端
  web: {}
  # 内部网络：格式化后端 ↔ 查询代理（宿主与前端均不可达）
  internal: {}
