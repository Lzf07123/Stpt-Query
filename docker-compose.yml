services:
  # ===== 容器 1：单体应用（编排 + 渲染 + 分析 + PDF + 内嵌查询代理）=====
  # 查询代理以内嵌 ASGI 应用在同一进程内运行，不再需要内部网络与内部令牌。
  # 默认单实例、无 Redis（同步查询 + 内存限流/历史 + JSONL 文件通道）。
  app:
    build:
      context: .
      args:
        BASE_IMAGE: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}python:3.11-slim
        APT_MIRROR: ${APT_MIRROR:-http://deb.debian.org/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}edu-query-app:${APP_IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: ${APP_MEM_LIMIT:-640m}
    pids_limit: 128
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/log/jwxt:size=16m,uid=10001,gid=10001
    volumes:
      - app-query-logs:/var/log/edu-query
      - app-notice-fallback:/var/lib/edu-query/notices
      - app-calendar:/var/lib/edu-query/calendar
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    networks:
      - web
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AUTO_ROTATE_TOKEN=${AUTO_ROTATE_TOKEN:-false}
      - API_TOKEN=${API_TOKEN:-change-me}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # 留空 = 单体模式（进程内直连查询代理）；显式地址仅用于过渡期或测试直连
      - SERVICE_BASE_URL=${SERVICE_BASE_URL:-}
      - SERVICE_TIMEOUT=${SERVICE_TIMEOUT:-60}
      - RESOURCE_MONITOR_INTERVAL_SECONDS=${RESOURCE_MONITOR_INTERVAL_SECONDS:-5}
      - RESOURCE_MONITOR_HISTORY_SIZE=${RESOURCE_MONITOR_HISTORY_SIZE:-90}
      - SERVICE_STATUS_CACHE_SECONDS=${SERVICE_STATUS_CACHE_SECONDS:-3}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-glm-4.5-flash}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
      - LLM_ENABLE_THINKING=${LLM_ENABLE_THINKING:-true}
      - LLM_SYSTEM_PROMPT=${LLM_SYSTEM_PROMPT:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-100}
      - CONCURRENCY_WAIT_TIMEOUT=${CONCURRENCY_WAIT_TIMEOUT:-2}
      - GLOBAL_CONCURRENCY=${GLOBAL_CONCURRENCY:-4}
      - RATE_LIMIT=${RATE_LIMIT:-30}
      # 默认唯一入口在 nginx 之后：信任被覆盖后的 X-Forwarded-For 做按 IP 限流
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      # 单实例默认无 Redis；如需异步任务/多副本，显式配置外部 Redis
      - REDIS_URL=${REDIS_URL:-}
      - INSTANCE_ID=${INSTANCE_ID:-}
      - JOB_WORKERS=${JOB_WORKERS:-2}
      - JOB_PENDING_LIMIT=${JOB_PENDING_LIMIT:-500}
      - JOB_RESULT_TTL_SECONDS=${JOB_RESULT_TTL_SECONDS:-900}
      - JOB_STALE_AFTER_SECONDS=${JOB_STALE_AFTER_SECONDS:-200}
      - LLM_CONCURRENCY=${LLM_CONCURRENCY:-8}
      - PDF_CONCURRENCY=${PDF_CONCURRENCY:-2}
      - MALLOC_ARENA_MAX=${MALLOC_ARENA_MAX:-2}
      - FILE_LOG_ENABLED=${FILE_LOG_ENABLED:-true}
      # {instance_id} 会替换成容器唯一实例标识；严禁多副本共享同一轮转 JSONL
      - FILE_LOG_PATH=${FILE_LOG_PATH:-/var/log/edu-query/{instance_id}/queries.jsonl}
      - HISTORY_SYNC_INTERVAL_SECONDS=${HISTORY_SYNC_INTERVAL_SECONDS:-60}
      - FILE_LOG_MAX_BYTES=${FILE_LOG_MAX_BYTES:-52428800}
      - FILE_LOG_BACKUP_COUNT=${FILE_LOG_BACKUP_COUNT:-7}
      # 全站通知的共享降级文件；Redis 只是热备份，权威数据仍在文件
      - NOTICE_FALLBACK_PATH=${NOTICE_FALLBACK_PATH:-/var/lib/edu-query/notices/notices.jsonl}
      - NOTICE_ACTIVE_MAX=${NOTICE_ACTIVE_MAX:-10}
      - NOTICE_HISTORY_MAX=${NOTICE_HISTORY_MAX:-500}
      - NOTICE_COMPACT_AFTER=${NOTICE_COMPACT_AFTER:-2000}
      - TZ=${TZ:-Asia/Shanghai}
      - HOST_PROC_ROOT=/host/proc
      - HOST_CGROUP_ROOT=/host/sys/fs/cgroup
      # ---- 内嵌查询代理（JWXT_*）----
      # 对外链接（免密登录/课表下载）基准地址：公网入口，浏览器可达
      - JWXT_PUBLIC_URL=${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      - JWXT_SESSION_TTL_HOURS=${JWXT_SESSION_TTL_HOURS:-1}
      - JWXT_RATE_LIMIT=${JWXT_RATE_LIMIT:-600}
      - JWXT_LOGIN_RATE_LIMIT=${JWXT_LOGIN_RATE_LIMIT:-60}
      - JWXT_GRADES_CACHE_TTL=${JWXT_GRADES_CACHE_TTL:-300}
      - JWXT_SCHEDULE_CACHE_TTL=${JWXT_SCHEDULE_CACHE_TTL:-300}
      - JWXT_SCHEDULE_PDF_CACHE_TTL=${JWXT_SCHEDULE_PDF_CACHE_TTL:-300}
      - JWXT_JUMP_CACHE_TTL=${JWXT_JUMP_CACHE_TTL:-30}
      - JWXT_HEALTH_PROBE_INTERVAL=${JWXT_HEALTH_PROBE_INTERVAL:-30}
      - JWXT_VERIFY_TLS=${JWXT_VERIFY_TLS:-1}
      - JWXT_UPSTREAM_PARALLEL=${JWXT_UPSTREAM_PARALLEL:-4}
      - JWXT_UPSTREAM_GLOBAL=${JWXT_UPSTREAM_GLOBAL:-8}
      - JWXT_LIMIT_CONCURRENCY=${JWXT_LIMIT_CONCURRENCY:-0}
      - JWXT_MAX_SEMESTERS=${JWXT_MAX_SEMESTERS:-20}
      - JWXT_LOG_LEVEL=${JWXT_LOG_LEVEL:-INFO}
      - JWXT_CORS_ORIGIN=${JWXT_CORS_ORIGIN:-}
      - JWXT_ALLOW_GET_CREDENTIALS=${JWXT_ALLOW_GET_CREDENTIALS:-1}
      - JWXT_PROTECT_LOGIN_STATUS=${JWXT_PROTECT_LOGIN_STATUS:-0}
      - JWXT_MAX_SESSIONS=${JWXT_MAX_SESSIONS:-1000}
      - JWXT_GRADES_CACHE_MAX_ITEMS=${JWXT_GRADES_CACHE_MAX_ITEMS:-1000}
      - JWXT_SCHEDULE_CACHE_MAX_ITEMS=${JWXT_SCHEDULE_CACHE_MAX_ITEMS:-1000}
      - JWXT_SCHEDULE_PDF_CACHE_MAX_ITEMS=${JWXT_SCHEDULE_PDF_CACHE_MAX_ITEMS:-8}
      - JWXT_JUMP_CACHE_MAX_ITEMS=${JWXT_JUMP_CACHE_MAX_ITEMS:-1000}
      - JWXT_PDF_TIMEOUT=${JWXT_PDF_TIMEOUT:-30}
      - JWXT_PDF_CONCURRENCY=${JWXT_PDF_CONCURRENCY:-1}
      - JWXT_PDF_MAX_INPUT_MB=${JWXT_PDF_MAX_INPUT_MB:-5}
      - JWXT_SCHEDULE_PDF_PREWARM=${JWXT_SCHEDULE_PDF_PREWARM:-1}
      # 内嵌调用来自本进程，不信任外部 XFF；外部客户端 IP 由编排层限流负责
      - JWXT_TRUST_PROXY=0
      - JWXT_LOG_FILE=
      - JWXT_DNS_FALLBACK_IPS=${JWXT_DNS_FALLBACK_IPS:-}
      # ---- 网络日历订阅（可选）----
      - CALENDAR_ENABLED=${CALENDAR_ENABLED:-false}
      - CALENDAR_MASTER_KEY=${CALENDAR_MASTER_KEY:-}
      - CALENDAR_DB_PATH=${CALENDAR_DB_PATH:-/var/lib/edu-query/calendar/calendar.db}
      - CALENDAR_CONFIG_PATH=${CALENDAR_CONFIG_PATH:-config/calendar.json}
      - CALENDAR_PUBLIC_BASE_URL=${CALENDAR_PUBLIC_BASE_URL:-${PUBLIC_BASE_URL:-http://127.0.0.1:8000}}
      - CALENDAR_DEFAULT_REFRESH_SECONDS=${CALENDAR_DEFAULT_REFRESH_SECONDS:-43200}
      - CALENDAR_MIN_REFRESH_SECONDS=${CALENDAR_MIN_REFRESH_SECONDS:-3600}
      - CALENDAR_MAX_FAILURES=${CALENDAR_MAX_FAILURES:-3}
      - CALENDAR_PAUSE_HOURS=${CALENDAR_PAUSE_HOURS:-24}
      - CALENDAR_MAX_PER_OWNER=${CALENDAR_MAX_PER_OWNER:-5}
      - CALENDAR_TTL_DAYS=${CALENDAR_TTL_DAYS:-210}
      - CALENDAR_SCHEDULER_INTERVAL_SECONDS=${CALENDAR_SCHEDULER_INTERVAL_SECONDS:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ===== 容器 2：前端（默认唯一对外入口）=====
  # nginx 静态页 + 反代 /run、/service-status、/health*、/notices* 到单体应用
  frontend:
    build:
      context: ./frontend
      args:
        BASE_IMAGE: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}nginxinc/nginx-unprivileged:1.27-alpine
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}edu-query-frontend:${APP_IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: ${FRONTEND_MEM_LIMIT:-64m}
    pids_limit: 32
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /etc/nginx/conf.d:size=64k,uid=101,gid=101
    networks:
      - web
    environment:
      # 与单体应用共用同一 API_TOKEN，由 nginx 反代时注入 Authorization
      - API_TOKEN=${API_TOKEN:-change-me}
      # 外层反代来源；nginx 仅信任该来源的 XFF 并恢复真实客户端 IP
      - TRUSTED_PROXY_CIDR=${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      # 品牌文案覆盖（留空使用 brand.js 内置默认值；BRAND_GITHUB=none 隐藏页脚链接）
      - BRAND_NAME=${BRAND_NAME:-}
      - BRAND_SLOGAN=${BRAND_SLOGAN:-}
      - BRAND_DESCRIPTION=${BRAND_DESCRIPTION:-}
      - BRAND_AUTHOR=${BRAND_AUTHOR:-}
      - BRAND_GITHUB=${BRAND_GITHUB:-}
    ports:
      - "${APP_PORT:-8000}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  # 边缘网络：nginx ↔ 单体应用（唯一网络；不再有内网分层）
  web: {}

volumes:
  # 查询日志文件通道；业务编排仍无状态，日志随具名持久卷跨容器/守护进程重启保留
  # 卷名沿用单体化前的 format 前缀：改名等于换卷，会丢既有日志，故保留
  app-query-logs:
    name: edu-query-app_format-query-logs-persistent
    driver: local
  # 全站通知运营配置的共享降级文件；属用户确认的无状态规则例外
  # 卷名同样保留历史 format 前缀，理由同上（既有通知与历史不可丢）
  app-notice-fallback:
    name: edu-query-app_format-notice-fallback
    driver: local
  # 日历订阅权威库（SQLite）+ 加密凭据；单实例部署
  app-calendar:
    name: edu-query-app_calendar
    driver: local
