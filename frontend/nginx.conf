# 固定 worker 数：容器 pids_limit=128（见 docker-compose.yml，单容器含 uvicorn
# 与 LibreOffice 短暂进程），auto 会按宿主 CPU 核数拉起 worker，多核宿主上会
# 挤占编排进程预算；2 个 worker 对静态页 + 反代场景绰绰有余。
worker_processes 2;
# 滚动发布/停机时给在途连接留出排空时间（配合 compose 优雅停机）
worker_shutdown_timeout 30s;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # text/calendar：/cal/*.ics 一学期事件体量大，必须压缩传输
    gzip_types text/plain text/css text/calendar text/xml application/javascript application/json image/svg+xml;

    # 边缘限流（保护性挡板）：按真实客户端 IP（conf.d 模板已按 TRUSTED_PROXY_CIDR
    # 恢复 $remote_addr）做宽松限速，抵御突发刷量/重放；业务限流仍由 app 层
    # RATE_LIMIT（默认 30/min/IP）负责，这里 10r/s 仅拦截明显异常流量。
    # 公开只读路径（/health*、/notices*、/service-status、/cal/）不做限流，
    # 日历客户端与健康检查会高频轮询。
    limit_req_zone $remote_addr zone=perip:10m rate=10r/s;

    include /etc/nginx/conf.d/*.conf;
}
