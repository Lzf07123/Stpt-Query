<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教务信息查询</title>
  <link rel="icon" href="/image/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Crimson+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      document.documentElement.classList.add("js");
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --text: #0f172a;
      --text-light: #64748b;
      --primary: #1e3a5f;
      --primary-soft: #e8edf3;
      --primary-hover: #16324f;
      --success: #059669;
      --warning: #b45309;
      --danger: #dc2626;
      --border: #cbd5e1;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
      --radius: 12px;

      /* 兼容旧别名：全部引用上方配色变量 */
      --card: var(--surface);
      --line: var(--border);
      --muted: var(--text-light);
      --ok: var(--success);
      --input-bg: var(--surface);
      --input-text: var(--text);
      --hover-soft: var(--primary-soft);
      --ghost-bg: var(--surface-alt);
      --ghost-hover: var(--border);
      --th-bg: var(--surface-alt);
      --quote-bg: var(--primary-soft);
      --quote-text: var(--text-light);
      --code-bg: var(--surface-alt);
      --seg-empty: var(--border);
      --shadow: var(--shadow-sm);
      --on-primary: #ffffff;
      --score-high: var(--success);
      --score-mid: var(--warning);
      --score-low: var(--danger);
      --tooltip-bg: var(--surface-alt);
      --tooltip-text: var(--text);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1b2336;
      --surface-alt: #273349;
      --text: #f1f5f9;
      --text-light: #94a3b8;
      --primary: #60a5fa;
      --primary-soft: #1e3a5f;
      --primary-hover: #3b82f6;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --border: #334155;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);

      --card: var(--surface);
      --line: var(--border);
      --muted: var(--text-light);
      --ok: var(--success);
      --input-bg: var(--surface);
      --input-text: var(--text);
      --hover-soft: var(--primary-soft);
      --ghost-bg: var(--surface-alt);
      --ghost-hover: var(--border);
      --th-bg: var(--surface-alt);
      --quote-bg: var(--primary-soft);
      --quote-text: var(--text-light);
      --code-bg: var(--surface-alt);
      --seg-empty: var(--border);
      --shadow: var(--shadow-sm);
      --on-primary: #ffffff;
      --score-high: var(--success);
      --score-mid: var(--warning);
      --score-low: var(--danger);
      --tooltip-bg: var(--surface-alt);
      --tooltip-text: var(--text);
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    html { transition: background-color .35s ease; }
    body {
      margin: 0;
      font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background-color .35s ease, color .35s ease;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(600px 400px at 12% 8%, color-mix(in srgb, var(--primary) 14%, transparent), transparent 70%),
        radial-gradient(700px 500px at 88% 18%, color-mix(in srgb, var(--primary) 10%, transparent), transparent 70%),
        radial-gradient(500px 400px at 60% 85%, color-mix(in srgb, var(--warning) 8%, transparent), transparent 70%);
    }
    html.js body { opacity: 0; }
    html.js body.page-loaded {
      opacity: 1;
      transition: opacity .5s ease;
    }
    .wrap { max-width: 1600px; margin: 0 auto; padding: 28px 16px 56px; }
    h1, h2, h3, .status-title, .state-card .state-title {
      font-family: "Crimson Pro", Georgia, "Songti SC", serif;
    }
    h1 { font-size: 30px; margin: 0; letter-spacing: .01em; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .head {
      margin-bottom: 4px;
      text-align: center;
      padding: 0 4px;
      overflow-wrap: anywhere;
      position: relative;
    }
    .theme-toggle {
      position: absolute;
      top: -6px;
      right: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform .25s ease, background-color .25s ease, box-shadow .25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .theme-toggle:hover {
      transform: rotate(15deg) scale(1.08);
      box-shadow: var(--shadow-md);
    }
    .theme-toggle svg { width: 20px; height: 20px; }
    .card {
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: var(--radius);
      padding: 24px;
      margin-top: 16px;
      box-shadow: var(--shadow-md);
      max-width: 100%;
      min-width: 0;
      overflow-wrap: anywhere;
      transition: background-color .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 16px;
      align-items: start;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .layout > * { min-width: 0; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      background: color-mix(in srgb, var(--input-bg) 72%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--input-text);
      transition: background-color .25s ease, border-color .25s ease, color .25s ease;
    }
    input:focus, select:focus {
      outline: 2px solid color-mix(in srgb, var(--primary) 35%, transparent);
      border-color: var(--primary);
    }
    select { appearance: none; -webkit-appearance: none; }
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: "";
      position: absolute;
      right: 14px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }
    .select-wrap select { padding-right: 38px; cursor: pointer; }
    .dropdown { position: relative; }
    .dropdown-trigger {
      position: relative;
      width: 100%;
      padding: 9px 38px 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--input-bg) 72%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--input-text);
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      font-weight: 500;
      transition: border-color .2s ease, background-color .2s ease;
    }
    .dropdown-trigger::after {
      content: "";
      position: absolute;
      right: 14px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 50;
      max-height: 240px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 6px;
    }
    .dropdown-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .dropdown-item:hover,
    .dropdown-item.active {
      background: var(--primary-soft);
      color: var(--primary);
    }
    .dropdown-item.active { font-weight: 600; }
    .segmented {
      display: flex;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3px;
      gap: 3px;
    }
    .seg-btn {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .seg-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 58px; }
    .show-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--primary);
      font-size: 13px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .show-btn:hover { background: var(--hover-soft); }
    .checks { display: flex; flex-direction: column; gap: 10px; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }
    .check input { width: auto; }
    .history-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .history-row select { flex: 1; }
    .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: 0 6px 18px color-mix(in srgb, var(--primary) 25%, transparent);
      transition: background-color .25s ease, transform .18s ease, box-shadow .25s ease;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px color-mix(in srgb, var(--primary) 32%, transparent);
    }
    .btn-ghost {
      background: color-mix(in srgb, var(--ghost-bg) 72%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      color: var(--text);
      transition: background-color .25s ease, transform .18s ease;
    }
    .btn-ghost:hover {
      background: var(--ghost-hover);
      transform: translateY(-1px);
    }
    .btn-primary:active, .btn-ghost:active { transform: scale(.97); }
    .btn-primary, .btn-ghost { position: relative; overflow: hidden; }
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: color-mix(in srgb, var(--on-primary) 25%, transparent);
      transform: scale(0);
      animation: ripple .6s ease-out forwards;
      pointer-events: none;
    }
    .btn-ghost .ripple { background: color-mix(in srgb, var(--primary) 18%, transparent); }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 10px 0;
      max-width: 100%;
    }
    .table-scroll table { min-width: 520px; }
    pre {
      background: var(--surface-alt);
      color: var(--text);
      padding: 14px;
      border-radius: 8px;
      overflow: auto;
      max-height: 440px;
      font-size: 13px;
      line-height: 1.55;
      margin: 0;
      max-width: 100%;
    }
    .markdown-body {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .markdown-body img { max-width: 100%; height: auto; }
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 { margin: 16px 0 8px; }
    .markdown-body p { margin: 8px 0; }
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
      font-size: 13px;
    }
    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--line);
      padding: 7px 10px;
      text-align: left;
      vertical-align: top;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .markdown-body th { background: var(--th-bg); font-weight: 600; }
    .markdown-body blockquote {
      margin: 10px 0;
      padding: 8px 12px;
      border-left: 3px solid var(--primary);
      background: var(--quote-bg);
      border-radius: 6px;
      color: var(--quote-text);
    }
    .markdown-body code {
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }
    .markdown-body pre {
      background: var(--surface-alt);
      color: var(--text);
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
      margin: 10px 0;
    }
    .markdown-body pre code { background: transparent; padding: 0; }
    .markdown-body a { color: var(--primary); }
    .markdown-body ul,
    .markdown-body ol { margin: 8px 0; padding-left: 22px; }
    .markdown-body li { margin: 3px 0; }
    .markdown-body hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
    .hidden { display: none; }
    #status { font-size: 13px; margin-top: 10px; }
    #status.error { color: var(--danger); }
    #status.ok { color: var(--ok); }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid color-mix(in srgb, var(--primary) 35%, transparent);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (min-width: 960px) {
      .layout.has-result {
        max-width: none;
        grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
      }
      #resultCard { position: sticky; top: 16px; }
    }
    @media (max-width: 600px) {
      .wrap { padding: 12px 10px 36px; }
      h1 { font-size: 19px; }
      .card { padding: 14px; border-radius: 10px; }
      .row { grid-template-columns: 1fr; }
      .status-bar { gap: 1px; }
      .toast-wrap { right: 10px; }
      input, select { font-size: 16px; padding: 10px; }
      .actions button { flex: 1 1 100%; }
      pre { max-height: 60vh; font-size: 12px; }
    }
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 28px;
      padding-bottom: 8px;
      padding-left: 10px;
      padding-right: 10px;
      overflow-wrap: anywhere;
    }
    .footer a {
      color: var(--muted);
      text-decoration: none;
    }
    .footer a:hover { color: var(--primary); }
    .footer img {
      width: 14px;
      height: 14px;
      vertical-align: -2px;
      margin-right: 3px;
    }
    .service-status {
      width: 100%;
      max-width: 680px;
      margin: 24px auto 0;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .status-title { font-weight: 600; margin-bottom: 8px; }
    .status-bar {
      display: flex;
      gap: 2px;
      justify-content: center;
      width: 100%;
      margin: 0 auto;
    }
    .status-bar-mobile {
      display: flex;
      height: 16px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--seg-empty);
      width: 100%;
    }
    .status-bar-mobile span { display: block; height: 100%; transition: width .3s ease; }
    .status-bar-mobile .seg-success { background: var(--ok); }
    .status-bar-mobile .seg-fail { background: var(--danger); }
    .status-seg {
      flex: 1;
      height: 14px;
      border-radius: 2px;
      background: var(--seg-empty);
      cursor: default;
    }
    .status-seg.success { background: var(--ok); }
    .status-seg.fail { background: var(--danger); }
    .status-summary { margin-top: 8px; font-size: 12px; }
    .status-summary .avail-good { color: var(--ok); font-weight: 600; }
    .status-summary .avail-mid { color: var(--warning); font-weight: 600; }
    .status-summary .avail-bad { color: var(--danger); font-weight: 600; }
    .status-tooltip {
      position: fixed;
      z-index: 999;
      background: var(--tooltip-bg);
      color: var(--tooltip-text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.4;
      white-space: normal;
      max-width: min(280px, calc(100vw - 16px));
      overflow-wrap: anywhere;
      box-shadow: var(--shadow-md);
      pointer-events: none;
    }
    #resultCard { opacity: 1; transition: opacity .22s ease; }
    #resultCard.fade-out { opacity: 0; }
    #resultCard.fade-in { animation: contentFadeIn .32s ease; }
    @keyframes contentFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .skeleton { padding: 4px 2px; }
    .skeleton-line {
      height: 18px;
      width: 60%;
      margin: 0 0 14px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--seg-empty) 25%, var(--ghost-bg) 50%, var(--seg-empty) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-row {
      height: 46px;
      margin: 8px 0;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--seg-empty) 25%, var(--ghost-bg) 50%, var(--seg-empty) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .btn-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid color-mix(in srgb, var(--on-primary) 35%, transparent);
      border-top-color: var(--on-primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
      vertical-align: -2px;
      margin-right: 6px;
    }
    .btn-spinner.hidden { display: none; }
    .state-card {
      text-align: center;
      padding: 30px 16px;
      color: var(--muted);
    }
    .state-card .state-icon { font-size: 42px; margin-bottom: 10px; }
    .state-card .state-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .state-card button { margin-top: 14px; }
    .score-high { color: var(--score-high); font-weight: 700; }
    .score-mid { color: var(--score-mid); font-weight: 600; }
    .score-low { color: var(--score-low); font-weight: 600; }
    .score-unpub {
      background: color-mix(in srgb, var(--warning) 12%, transparent);
      color: var(--warning);
      border-radius: 6px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.required { background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--primary); }
    .badge.elective { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
    .badge.practice { background: color-mix(in srgb, var(--success) 16%, transparent); color: var(--ok); }
    .badge.other { background: var(--ghost-bg); color: var(--muted); }
    .score-bar {
      height: 4px;
      margin-top: 4px;
      border-radius: 2px;
      background: var(--seg-empty);
      overflow: hidden;
    }
    .score-bar i {
      display: block;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--danger), var(--warning), var(--success));
    }
    .cache-note {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .offline-bar {
      margin: 16px auto 0;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--warning) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent);
      color: var(--warning);
      font-size: 13px;
    }
    .offline-bar.hidden { display: none; }
    .offline-bar .btn-ghost { padding: 6px 12px; font-size: 12px; }
    .toast-wrap {
      position: fixed;
      top: 16px;
      right: 16px;
      left: auto;
      transform: none;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      pointer-events: none;
      max-width: min(92vw, 420px);
    }
    .toast {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      box-shadow: var(--shadow-md);
      animation: toastIn .25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.out { animation: toastOut .25s ease forwards; }
    .toast.success { border-left: 3px solid var(--ok); }
    .toast.error { border-left: 3px solid var(--danger); }
    .toast.info { border-left: 3px solid var(--primary); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes toastOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateY(-8px); }
    }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    @media (max-width: 600px) {
      .table-scroll {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        max-width: 100%;
      }
      .markdown-body table {
        width: max-content;
        min-width: 100%;
      }
      .markdown-body th,
      .markdown-body td {
        white-space: nowrap;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <button type="button" id="themeToggle" class="theme-toggle" aria-label="切换主题">🌙</button>
      <h1>教务信息查询</h1>
      <div class="sub">通过学校统一身份认证查询成绩 / 课表 · 网关令牌已由服务端内置，无需填写</div>
    </div>

    <div id="offlineBar" class="offline-bar hidden"></div>
    <div class="layout">
      <form id="queryForm" class="card">
        <div class="row">
          <div>
            <label for="username">学号</label>
            <input id="username" required placeholder="10 位数字学号" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" autocomplete="off">
          </div>
          <div>
            <label for="password">密码</label>
            <div class="input-wrap">
              <input id="password" type="password" required placeholder="教务系统密码" autocomplete="current-password">
              <button type="button" class="show-btn" id="togglePassword">显示</button>
            </div>
          </div>
          <div>
            <label for="option">查询项目</label>
            <div class="segmented" role="tablist" aria-label="查询项目">
              <button type="button" class="seg-btn" data-option="课表">课表</button>
              <button type="button" class="seg-btn" data-option="成绩">成绩</button>
            </div>
            <input type="hidden" id="option" value="课表">
          </div>
          <div>
            <label for="semesters">学期（默认当前学期）</label>
            <div class="dropdown" id="semestersDropdown">
              <button type="button" class="dropdown-trigger" id="semestersTrigger" aria-haspopup="listbox" aria-expanded="false">默认当前学期</button>
              <div class="dropdown-menu hidden" id="semestersMenu" role="listbox">
                <button type="button" class="dropdown-item" data-value="">默认当前学期</button>
                <button type="button" class="dropdown-item" data-value="2027-2028-2">2027-2028-2</button>
                <button type="button" class="dropdown-item" data-value="2027-2028-1">2027-2028-1</button>
                <button type="button" class="dropdown-item" data-value="2026-2027-2">2026-2027-2</button>
                <button type="button" class="dropdown-item" data-value="2026-2027-1">2026-2027-1</button>
                <button type="button" class="dropdown-item" data-value="2025-2026-2">2025-2026-2</button>
                <button type="button" class="dropdown-item" data-value="2025-2026-1">2025-2026-1</button>
                <button type="button" class="dropdown-item" data-value="2024-2025-2">2024-2025-2</button>
                <button type="button" class="dropdown-item" data-value="2024-2025-1">2024-2025-1</button>
              </div>
              <input type="hidden" id="semesters" value="">
            </div>
          </div>
          <div id="weeksField">
            <label for="weeks">周数（默认全部）</label>
            <div class="dropdown" id="weeksDropdown">
              <button type="button" class="dropdown-trigger" id="weeksTrigger" aria-haspopup="listbox" aria-expanded="false">全部</button>
              <div class="dropdown-menu hidden" id="weeksMenu" role="listbox">
                <button type="button" class="dropdown-item" data-value="all">全部</button>
                <button type="button" class="dropdown-item" data-value="1-5">1-5 周</button>
                <button type="button" class="dropdown-item" data-value="6-10">6-10 周</button>
                <button type="button" class="dropdown-item" data-value="11-15">11-15 周</button>
                <button type="button" class="dropdown-item" data-value="16-20">16-20 周</button>
                <button type="button" class="dropdown-item" data-value="1">第 1 周</button>
                <button type="button" class="dropdown-item" data-value="2">第 2 周</button>
                <button type="button" class="dropdown-item" data-value="3">第 3 周</button>
                <button type="button" class="dropdown-item" data-value="4">第 4 周</button>
                <button type="button" class="dropdown-item" data-value="5">第 5 周</button>
                <button type="button" class="dropdown-item" data-value="6">第 6 周</button>
                <button type="button" class="dropdown-item" data-value="7">第 7 周</button>
                <button type="button" class="dropdown-item" data-value="8">第 8 周</button>
                <button type="button" class="dropdown-item" data-value="9">第 9 周</button>
                <button type="button" class="dropdown-item" data-value="10">第 10 周</button>
                <button type="button" class="dropdown-item" data-value="11">第 11 周</button>
                <button type="button" class="dropdown-item" data-value="12">第 12 周</button>
                <button type="button" class="dropdown-item" data-value="13">第 13 周</button>
                <button type="button" class="dropdown-item" data-value="14">第 14 周</button>
                <button type="button" class="dropdown-item" data-value="15">第 15 周</button>
                <button type="button" class="dropdown-item" data-value="16">第 16 周</button>
                <button type="button" class="dropdown-item" data-value="17">第 17 周</button>
                <button type="button" class="dropdown-item" data-value="18">第 18 周</button>

          <div class="full checks" id="gradeOptions">
            <label class="check">
              <input type="checkbox" id="md2pdf">
              仅生成 PDF 文档（仅查询成绩时适用，移动端存在兼容问题）
            </label>
            <label class="check">
              <input type="checkbox" id="check">
              分析成绩（查询成绩时生效，输出时间可能延长）
            </label>
          </div>
          <div class="full history-row">
            <div style="flex:1">
              <label for="historyTrigger">历史查询结果</label>
              <div class="dropdown" id="historyDropdown">
                <button type="button" class="dropdown-trigger" id="historyTrigger" aria-haspopup="listbox" aria-expanded="false">— 选择历史查询结果 —</button>
                <div class="dropdown-menu hidden" id="historyMenu" role="listbox"></div>

          <button class="btn-primary" type="submit" id="submitBtn">
            <span class="btn-spinner hidden" id="submitSpinner"></span>

        <div id="status" class="hidden" aria-live="polite"></div>
      </form>

      <div id="resultCard" class="card hidden" aria-live="polite">
        <h2 style="font-size: 16px; margin-top: 0;">返回结果</h2>
        <div id="skeleton" class="skeleton hidden">
          <div class="skeleton-line"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
        </div>
        <div id="resultHtml" class="markdown-body hidden"></div>
        <pre id="result" class="hidden"></pre>
      </div>
    </div>

    <div id="serviceStatus" class="service-status hidden"></div>
    <div id="statusTooltip" class="status-tooltip hidden"></div>
    <footer class="footer"></footer>
  </div>

  <div id="toastWrap" class="toast-wrap"></div>
  <script>
    // 网关令牌由 FastAPI 根路径渲染时从服务端配置注入，不在静态文件中写死
    const GATEWAY_TOKEN = "";

    const themeToggle = document.getElementById("themeToggle");
    const SUN_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
    const MOON_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeToggle.innerHTML = theme === "dark" ? SUN_ICON : MOON_ICON;
      try { localStorage.setItem("theme", theme); } catch (e) {}
    }
    themeToggle.addEventListener("click", function () {
      const current = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(current);
    });
    applyTheme(document.documentElement.getAttribute("data-theme") || "light");

    const form = document.getElementById("queryForm");
    const usernameInput = document.getElementById("username");
    usernameInput.addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 10);
    });
    const passwordInput = document.getElementById("password");
    const optionInput = document.getElementById("option");
    const semestersInput = document.getElementById("semesters");
    const weeksInput = document.getElementById("weeks");
    const md2pdfInput = document.getElementById("md2pdf");
    const checkInput = document.getElementById("check");
    const submitBtn = document.getElementById("submitBtn");
    const submitSpinner = document.getElementById("submitSpinner");
    const submitBtnText = document.getElementById("submitBtnText");
    const skeleton = document.getElementById("skeleton");
    const statusBox = document.getElementById("status");
    const resultCard = document.getElementById("resultCard");
    const resultHtml = document.getElementById("resultHtml");
    const resultBox = document.getElementById("result");
    const layout = document.querySelector(".layout");
    const serviceStatusBox = document.getElementById("serviceStatus");
    const statusTooltip = document.getElementById("statusTooltip");
    const toastWrap = document.getElementById("toastWrap");
    const offlineBar = document.getElementById("offlineBar");

    let queryController = null;
    const historyTrigger = document.getElementById("historyTrigger");
    const historyMenu = document.getElementById("historyMenu");
    const historyClear = document.getElementById("historyClear");

    // Cookie 工具：历史查询记录（不含密码）
    const HISTORY_KEY = "dify_query_results_v3";
    const MAX_HISTORY = 5;

    function setCookie(name, value, days) {
      const date = new Date();
      date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
      document.cookie = name + "=" + encodeURIComponent(value) +
        "; expires=" + date.toUTCString() + "; path=/; SameSite=Lax";
    }

    function getCookie(name) {
      const m = document.cookie.match(new RegExp(
        "(?:^|; )" + name.replace(/([.$?*|{}()\[\]\\\/\+^])/g, "\\$1") + "=([^;]*)"
      ));
      return m ? decodeURIComponent(m[1]) : null;
    }

    function loadHistory() {
      try {
        const raw = getCookie(HISTORY_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function recordLabel(r) {
      let label = (r.username || "?") + " · " + (r.option || "");
      if (r.semesters) label += " · " + r.semesters;
      if (r.weeks && r.weeks !== "all") label += " · 周" + r.weeks;
      if (r.md2pdf) label += " · PDF";
      if (r.check) label += " · 分析";
      return label;
    }

    function storeResultText(id, text) {
      try { localStorage.setItem("dify_query_result_" + id, text); } catch (e) {}
    }

    function getResultText(id) {
      try { return localStorage.getItem("dify_query_result_" + id) || ""; } catch (e) { return ""; }
    }

    function removeResultText(id) {
      try { localStorage.removeItem("dify_query_result_" + id); } catch (e) {}
    }

    function saveResultRecord(record) {
      let arr = loadHistory();
      const dupIndex = arr.findIndex(function (r) {
        return r.username === record.username &&
          r.option === record.option &&
          r.semesters === record.semesters &&
          r.weeks === record.weeks;
      });
      if (dupIndex !== -1) {
        removeResultText(arr[dupIndex].id);
        arr.splice(dupIndex, 1);
      }
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      storeResultText(id, String(record.resultText || ""));
      arr.unshift({
        id: id,
        savedAt: Date.now(),
        username: record.username,
        option: record.option,
        semesters: record.semesters || "",
        weeks: record.weeks,
        md2pdf: !!record.md2pdf,
        check: !!record.check,
        isMarkdown: !!record.isMarkdown
      });
      if (arr.length > MAX_HISTORY) {
        arr.slice(MAX_HISTORY).forEach(function (r) { removeResultText(r.id); });
        arr = arr.slice(0, MAX_HISTORY);
      }
      setCookie(HISTORY_KEY, JSON.stringify(arr), 30);
    }

    function renderHistorySelect() {
      const arr = loadHistory();
      const current = historyTrigger.getAttribute("data-label") || "";
      historyMenu.innerHTML = arr.map(function (r, i) {
        const label = recordLabel(r);
        return '<button type="button" class="dropdown-item" data-index="' + i + '">' +
          label.replace(/"/g, "&quot;") + "</button>";
      }).join("");
      if (current && arr.some(function (r) { return recordLabel(r) === current; })) {
        historyTrigger.textContent = current;
      } else {
        historyTrigger.textContent = "— 选择历史查询结果 —";
        historyTrigger.removeAttribute("data-label");
      }
    }

    function displaySavedRecord(rec) {
      if (!rec) return;
      clearTimeout(resultTimer);
      resultCard.classList.remove("hidden");
      layout.classList.add("has-result");
      resultCard.classList.remove("fade-in");
      resultCard.classList.add("fade-out");
      resultTimer = setTimeout(function () {
        const text = getResultText(rec.id) || rec.resultText || "";
        let note = "";
        if (rec.savedAt) {
          const mins = Math.max(0, Math.round((Date.now() - rec.savedAt) / 60000));
          note = '<div class="cache-note">已加载本地缓存 · 更新于 ' +
            (mins < 1 ? "刚刚" : mins + " 分钟前") + "</div>";
        }
        if (rec.isMarkdown) {
          resultHtml.classList.remove("hidden");
          resultBox.classList.add("hidden");
          resultHtml.innerHTML = note + renderMarkdown(text);
        } else {
          resultHtml.classList.add("hidden");
          resultBox.classList.remove("hidden");
          resultBox.textContent = text || "（无返回内容）";
        }
        resultCard.classList.remove("fade-out");
        resultCard.classList.add("fade-in");
      }, 180);
    }

    historyTrigger.addEventListener("click", function (e) {
      e.stopPropagation();
      const willOpen = historyMenu.classList.contains("hidden");
      document.querySelectorAll(".dropdown-menu").forEach(function (m) {
        m.classList.add("hidden");
      });
      document.querySelectorAll(".dropdown-trigger").forEach(function (t) {
        t.setAttribute("aria-expanded", "false");
      });
      if (willOpen) {
        historyMenu.classList.remove("hidden");
        historyTrigger.setAttribute("aria-expanded", "true");
      }
    });

    historyMenu.addEventListener("click", function (e) {
      const item = e.target.closest ? e.target.closest(".dropdown-item") : null;
      if (!item) return;
      const arr = loadHistory();
      const rec = arr[item.getAttribute("data-index")];
      if (rec) {
        usernameInput.value = rec.username || "";
        displaySavedRecord(rec);
        const label = recordLabel(rec);
        historyTrigger.textContent = label;
        historyTrigger.setAttribute("data-label", label);
      }
      historyMenu.classList.add("hidden");
      historyTrigger.setAttribute("aria-expanded", "false");
    });

    historyClear.addEventListener("click", function () {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.indexOf("dify_query_result_") === 0) {
          keys.push(key);
        }
      }
      keys.forEach(function (key) { localStorage.removeItem(key); });
      setCookie(HISTORY_KEY, JSON.stringify([]), 30);
      renderHistorySelect();
      historyTrigger.textContent = "— 选择历史查询结果 —";
      historyTrigger.removeAttribute("data-label");
      showToast("success", "历史记录已清空");
    });

    function showStatus(message, ok) {
      statusBox.textContent = message;
      statusBox.classList.remove("hidden", "error", "ok");
      statusBox.classList.add(ok ? "ok" : "error");
    }

    function syncOptionSeg() {
      document.querySelectorAll(".seg-btn").forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-option") === optionInput.value);
      });
      const isSchedule = optionInput.value === "课表";
      document.getElementById("weeksField").classList.toggle("hidden", !isSchedule);
      document.getElementById("gradeOptions").classList.toggle("hidden", isSchedule);
    }

    function initDropdown(triggerId, menuId, inputId, defaultLabel) {
      const trigger = document.getElementById(triggerId);
      const menu = document.getElementById(menuId);
      const input = document.getElementById(inputId);

      function syncLabel() {
        let found = false;
        menu.querySelectorAll(".dropdown-item").forEach(function (item) {
          const active = item.getAttribute("data-value") === input.value;
          item.classList.toggle("active", active);
          if (active) {
            trigger.textContent = item.textContent.trim();
            found = true;
          }
        });
        if (!found) trigger.textContent = defaultLabel;
      }

      trigger.addEventListener("click", function (e) {
        e.stopPropagation();
        const willOpen = menu.classList.contains("hidden");
        document.querySelectorAll(".dropdown-menu").forEach(function (m) {
          m.classList.add("hidden");
        });
        document.querySelectorAll(".dropdown-trigger").forEach(function (t) {
          t.setAttribute("aria-expanded", "false");
        });
        if (willOpen) {
          menu.classList.remove("hidden");
          trigger.setAttribute("aria-expanded", "true");
        }
      });

      menu.addEventListener("click", function (e) {
        const item = e.target.closest ? e.target.closest(".dropdown-item") : null;
        if (!item) return;
        input.value = item.getAttribute("data-value");
        syncLabel();
        menu.classList.add("hidden");
        trigger.setAttribute("aria-expanded", "false");
      });

      syncLabel();
      return { sync: syncLabel };
    }

    const semestersDropdown = initDropdown("semestersTrigger", "semestersMenu", "semesters", "默认当前学期");
    const weeksDropdown = initDropdown("weeksTrigger", "weeksMenu", "weeks", "全部");

    document.addEventListener("click", function () {
      document.querySelectorAll(".dropdown-menu").forEach(function (m) {
        m.classList.add("hidden");
      });
      document.querySelectorAll(".dropdown-trigger").forEach(function (t) {
        t.setAttribute("aria-expanded", "false");
      });
    });

    function showLoading() {
      statusBox.innerHTML = '<span class="spinner"></span>正在查询';
      statusBox.classList.remove("hidden", "error", "ok");
    }

    function showToast(type, message) {
      const el = document.createElement("div");
      el.className = "toast " + type;
      const icon = type === "success" ? "✅" : type === "error" ? "⚠️" : "ℹ️";
      el.textContent = icon + " " + message;
      toastWrap.appendChild(el);
      setTimeout(function () {
        el.classList.add("out");
        setTimeout(function () { el.remove(); }, 260);
      }, 3000);
    }

    function showOfflineBar(savedAt) {
      let time = "";
      if (savedAt) {
        const mins = Math.max(0, Math.round((Date.now() - savedAt) / 60000));
        time = " (" + (mins < 1 ? "刚刚" : mins + " 分钟前") + ")";
      }
      offlineBar.innerHTML = "⚠️ 当前离线，显示的是上次同步的数据" + time +
        ' <button type="button" class="btn-ghost" onclick="document.getElementById(\'queryForm\').requestSubmit()">手动刷新</button>';
      offlineBar.classList.remove("hidden");
    }

    function hideOfflineBar() {
      offlineBar.classList.add("hidden");
    }

    function setButtonLoading(loading) {
      submitBtn.disabled = loading;
      submitSpinner.classList.toggle("hidden", !loading);
      submitBtnText.textContent = loading ? "查询中..." : "查询";
    }

    function showStateCard(icon, title, desc, withRetry) {
      clearTimeout(resultTimer);
      skeleton.classList.add("hidden");
      resultBox.classList.add("hidden");
      resultHtml.classList.remove("hidden");
      resultCard.classList.remove("hidden");
      layout.classList.add("has-result");
      resultHtml.innerHTML =
        '<div class="state-card">' +
        '<div class="state-icon">' + icon + "</div>" +
        '<div class="state-title">' + title + "</div>" +
        (desc ? "<div>" + desc + "</div>" : "") +
        (withRetry ? '<button type="button" class="btn-primary" onclick="document.getElementById(\'queryForm\').requestSubmit()">重试</button>' : "") +
        "</div>";
      resultCard.classList.remove("fade-in");
      resultCard.classList.add("fade-in");
    }

    function showErrorCard(message) {
      showStateCard("😵", "数据加载失败", message, true);
      showStatus("查询失败", false);
    }

    function showEmptyState() {
      showStateCard("📭", "没有找到相关记录", "请尝试更换学期或查询项目", false);
    }

    function looksEmptyMarkdown(text) {
      if (!text || !text.trim()) return true;
      const pipeLines = text.split("\n").filter(function (line) {
        return line.trim().indexOf("|") === 0;
      });
      if (pipeLines.length >= 1 && pipeLines.length <= 2) return true;
      if (tableRowsAllEmpty(text)) return true;
      const plain = text.replace(/\|/g, " ").replace(/-{3,}/g, " ").trim();
      if (!plain) return true;
      const tokens = plain.split(/\s+/).filter(Boolean);
      if (tokens.length) {
        const restOnly = tokens.every(function (token) {

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function inlineFormat(text) {
      let html = escapeHtml(text);
      html = html.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
      );
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/(^|[^"'=])(https?:\/\/[^\s<>"']+)/g, function (m, pre, url) {
        url = url.replace(/[.,;:!?]+$/, "");
        return pre + '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + "</a>";
      });
      return html;
    }

    const SAFE_TAGS = new Set([
      "a", "abbr", "b", "blockquote", "br", "code", "del", "div", "em",
      "font", "h1", "h2", "h3", "h4", "h5", "h6", "hr", "i", "img",
      "li", "ol", "p", "pre", "s", "span", "strong", "table", "tbody",
      "td", "th", "thead", "tr", "ul"
    ]);
    const SAFE_ATTRS = new Set([
      "href", "src", "alt", "title", "color", "face", "size", "align",
      "colspan", "rowspan", "width", "height", "target", "rel"
    ]);
    const URL_ATTRS = new Set(["href", "src"]);

    function sanitizeTag(rawTag) {
      const match = rawTag.match(
        /^<\/?([a-zA-Z][a-zA-Z0-9]*)((?:\s+[a-zA-Z-]+(?:\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+))?)*)\s*\/?>$/
      );
      if (!match) return escapeHtml(rawTag);
      const tag = match[1].toLowerCase();
      if (!SAFE_TAGS.has(tag)) return escapeHtml(rawTag);
      if (rawTag.startsWith("</")) return "</" + tag + ">";

      let attrs = "";
      const attrRe = /([a-zA-Z-]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+)))?/g;
      let m;
      while ((m = attrRe.exec(match[2]))) {
        const name = m[1].toLowerCase();
        const value = m[2] !== undefined ? m[2] : m[3] !== undefined ? m[3] : (m[4] !== undefined ? m[4] : "");
        if (!SAFE_ATTRS.has(name)) continue;
        if (URL_ATTRS.has(name) && !/^(https?:|mailto:|#|\/)/i.test(value)) continue;
        attrs += " " + name + '="' + escapeHtml(value) + '"';
      }
      return "<" + tag + attrs + ">";
    }

    function renderInline(text) {
      const parts = String(text).split(/(<[^>]+>)/g);
      let html = "";
      for (const part of parts) {
        if (/^<\/?[a-zA-Z][^>]*>$/.test(part)) {
          html += sanitizeTag(part);
        } else {
          html += inlineFormat(part);
        }
      }
      return html;
    }

    function isTableSeparator(line) {
      return /^\s*\|?[\s:|-]+\|?\s*$/.test(line) && line.includes("-");
    }

    function renderMarkdown(text) {
      const lines = String(text).replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();

        if (!trimmed) { i++; continue; }

        if (trimmed.startsWith("```")) {
          const buf = [];
          i++;
          while (i < lines.length && !lines[i].trim().startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++;
          html.push("<pre><code>" + escapeHtml(buf.join("\n")) + "</code></pre>");
          continue;
        }

        if (trimmed.startsWith("|")) {
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim());
            i++;
          }
          if (rows.length >= 2 && isTableSeparator(rows[1])) {
            const cells = function (row) {
              return row.split("|").slice(1, -1).map(function (cell) {
                return cell.trim();
              });
            };
            const headers = cells(rows[0]).map(function (h) { return h.toLowerCase(); });
            const scoreIdx = headers.findIndex(function (h) {
              return h.indexOf("成绩") !== -1 || h.indexOf("分数") !== -1 || h === "score";
            });
            const typeIdx = headers.findIndex(function (h) {
              return h.indexOf("课程类别") !== -1 || h.indexOf("类型") !== -1 || h === "course type";
            });
            function decorateCell(cell, colIdx) {
              const plain = cell.trim();
              const label = escapeHtml(headers[colIdx] || "");
              if (colIdx === scoreIdx) {
                if (plain === "--" || plain === "—" || /未发布|暂无成绩/.test(plain)) {
                  return '<td data-label="' + label + '" class="score-unpub" title="成绩尚未发布">--</td>';
                }
                const num = parseFloat(plain.replace(/[^\d.]/g, ""));
                if (!isNaN(num)) {
                  let cls = "score-low";
                  if (num >= 90) cls = "score-high";
                  else if (num >= 75) cls = "score-mid";
                  const pct = Math.min(100, Math.max(0, num));
                  return '<td data-label="' + label + '" class="' + cls + '">' +
                    renderInline(cell) +
                    '<div class="score-bar"><i style="width:' + pct + '%"></i></div></td>';
                }
              }
              if (colIdx === typeIdx) {
                let cls = "other";
                if (plain.indexOf("必修") !== -1) cls = "required";
                else if (plain.indexOf("选修") !== -1 || plain.indexOf("任选") !== -1) cls = "elective";
                else if (plain.indexOf("实践") !== -1 || plain.indexOf("实验") !== -1 || plain.indexOf("实训") !== -1) cls = "practice";
                return '<td data-label="' + label + '"><span class="badge ' + cls + '">' + renderInline(cell) + "</span></td>";
              }
              return '<td data-label="' + label + '">' + renderInline(cell) + "</td>";
            }
            html.push('<div class="table-scroll"><table><thead><tr>');
            cells(rows[0]).forEach(function (cell) {
              html.push("<th>" + renderInline(cell) + "</th>");
            });
            html.push("</tr></thead>");
            if (rows.length > 2) {
              html.push("<tbody>");
              rows.slice(2).forEach(function (row) {
                html.push("<tr>");
                cells(row).forEach(function (cell, colIdx) {
                  html.push(decorateCell(cell, colIdx));
                });
                html.push("</tr>");
              });
              html.push("</tbody>");
            }
            html.push("</table></div>");
          } else {
            html.push("<p>" + renderInline(rows.join("<br>")) + "</p>");
          }
          continue;
        }

        const heading = trimmed.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          const level = heading[1].length;
          html.push("<h" + level + ">" + renderInline(heading[2]) + "</h" + level + ">");
          i++;
          continue;
        }

        if (trimmed.startsWith(">")) {
          const buf = [];
          while (i < lines.length && lines[i].trim().startsWith(">")) {
            buf.push(lines[i].trim().replace(/^>\s?/, ""));
            i++;
          }
          html.push("<blockquote>" + buf.map(renderInline).join("<br>") + "</blockquote>");
          continue;
        }

        const ulMatch = trimmed.match(/^[-*]\s+(.*)$/);
        if (ulMatch) {
          const items = [ulMatch[1]];
          i++;
          while (i < lines.length && /^[-*]\s+/.test(lines[i].trim())) {
            items.push(lines[i].trim().replace(/^[-*]\s+/, ""));
            i++;
          }
          html.push("<ul>" + items.map(function (item) {
            return "<li>" + renderInline(item) + "</li>";
          }).join("") + "</ul>");
          continue;
        }

        const olMatch = trimmed.match(/^\d+\.\s+(.*)$/);
        if (olMatch) {
          const items = [olMatch[1]];
          i++;
          while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) {
            items.push(lines[i].trim().replace(/^\d+\.\s+/, ""));
            i++;
          }
          html.push("<ol>" + items.map(function (item) {
            return "<li>" + renderInline(item) + "</li>";
          }).join("") + "</ol>");
          continue;
        }

        if (/^(-{3,}|\*{3,})$/.test(trimmed)) {
          html.push("<hr>");
          i++;
          continue;
        }

        const buf = [line];
        i++;
        while (i < lines.length) {
          const next = lines[i].trim();
          if (!next || /^(#{1,6}\s|>|[-*]\s|\d+\.\s|\||```|(-{3,}|\*{3,})$)/.test(next)) {
            break;
          }
          buf.push(lines[i]);
          i++;
        }
        html.push("<p>" + renderInline(buf.join(" ")) + "</p>");
      }

      return html.join("\n");
    }

    function extractMarkdownValue(body) {
      if (!body || typeof body !== "object") return null;
      let primary = null;
      let fallback = null;
      const extraLinks = [];
      const extraMarkdown = [];
      const seenUrls = new Set();
      const seenMarkdown = new Set();

      function extractMarkdownLinks(text) {
        const links = [];
        const re = /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g;
        let m;
        while ((m = re.exec(text))) {
          links.push(m[0]);
        }
        return links;
      }

      function pushLink(link) {
        const url = typeof link === "string" ? link : link.url;
        if (!/^https?:\/\//i.test(url) || seenUrls.has(url)) return;
        seenUrls.add(url);
        extraLinks.push(link);
      }

      function walk(node, inOutputs) {
        if (!node || typeof node !== "object") return;
        if (Array.isArray(node)) {
          for (const item of node) {
            if (item && typeof item === "object" && (item.url || item.download_url)) {
              const url = String(item.url || item.download_url || "");
              if (/^https?:\/\//i.test(url)) {
                pushLink({
                  name: String(item.filename || item.name || "下载文件"),
                  url: url
                });
              }
            }
            walk(item, inOutputs);
          }
          return;
        }
        for (const key of Object.keys(node)) {
          const value = node[key];
          const childOutputs = inOutputs || key === "outputs";
          if (typeof value === "string" && value.trim()) {
            if (key === "output_text") primary = primary || value;
            else if (key === "output") fallback = fallback || value;
            else if ((key === "result" || key === "markdown") && !primary && !fallback) {
              fallback = value;
            } else if (inOutputs && ["files", "download_url", "file_url", "url"].indexOf(key) !== -1) {
              const s = value.trim();
              const markdownLinks = extractMarkdownLinks(s);
              if (markdownLinks.length) {
                for (const link of markdownLinks) {
                  if (!seenMarkdown.has(link)) {
                    seenMarkdown.add(link);
                    extraMarkdown.push(link);
                  }
                }
              } else if (/^https?:\/\//i.test(s)) {
                pushLink(s);
              }
            }
          } else if (value && typeof value === "object") {
            walk(value, childOutputs);
          }
        }
      }

      walk(body, false);
      const parts = [];
      if (primary) parts.push(primary);
      if (
        fallback &&
        fallback !== primary &&
        (primary === null || primary.indexOf(fallback) === -1)
      ) {
        parts.push(fallback);
      }
      for (const link of extraLinks) {
        if (typeof link === "string") {
          parts.push("[下载文件](" + link + ")");
        } else {
          parts.push("[" + link.name + "](" + link.url + ")");
        }
      }
      parts.push.apply(parts, extraMarkdown);
      return parts.length ? parts.join("\n\n") : null;
    }

        );
      } catch (err) {
        if (err && err.name === "AbortError") return;
        const cached = loadHistory().find(function (r) {
          return r.username === payload.username &&
            r.option === payload.option &&
            (r.semesters || "") === (payload.semesters || "");
        });
        if (cached) {
          displaySavedRecord(cached);
          showOfflineBar(cached.savedAt);
          showStatus("网络异常，已展示缓存数据", false);
          showToast("info", "网络异常，已展示本地缓存数据");
        } else {
          hideOfflineBar();
          showErrorCard("网络请求失败，请稍后重试");
          showToast("error", "网络请求失败");
        }
        renderServiceStatus();
      } finally {
        if (seq === querySeq) {
          queryController = null;
          setButtonLoading(false);
          window.scrollTo(0, savedScrollY);
        }
      }
    });

    document.getElementById("resetBtn").addEventListener("click", function () {
      usernameInput.value = "";
      passwordInput.value = "";
      optionInput.value = "课表";
      semestersInput.value = "";
      weeksInput.value = "all";
      md2pdfInput.checked = false;
      checkInput.checked = false;
      passwordInput.type = "password";
      document.getElementById("togglePassword").textContent = "显示";
      historyTrigger.textContent = "— 选择历史查询结果 —";
      historyTrigger.removeAttribute("data-label");
      historyMenu.classList.add("hidden");
      historyTrigger.setAttribute("aria-expanded", "false");
      history.replaceState(null, "", location.pathname);
      syncOptionSeg();
      semestersDropdown.sync();
      weeksDropdown.sync();
      resultCard.classList.add("hidden");
      layout.classList.remove("has-result");
      statusBox.classList.add("hidden");
      hideOfflineBar();
    });

    document.getElementById("togglePassword").addEventListener("click", function () {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      this.textContent = show ? "隐藏" : "显示";
    });

    document.addEventListener("mousedown", function (event) {
      const btn = event.target.closest ? event.target.closest(".btn-primary, .btn-ghost") : null;
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const span = document.createElement("span");
      span.className = "ripple";
      span.style.width = size + "px";
      span.style.height = size + "px";
      span.style.left = event.clientX - rect.left - size / 2 + "px";
      span.style.top = event.clientY - rect.top - size / 2 + "px";
      btn.appendChild(span);
      setTimeout(function () { span.remove(); }, 600);
    });

    renderServiceStatus();
    renderHistorySelect();
    restoreUrlParams();
    window.addEventListener("scroll", hideStatusTooltip, { passive: true });
    window.addEventListener("resize", function () {
      hideStatusTooltip();
      renderServiceStatus();
    }, { passive: true });
    requestAnimationFrame(function () {
      document.body.classList.add("page-loaded");
    });
  </script>
</body>
</html>
